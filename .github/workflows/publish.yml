# Shipped into dist/.github/workflows/publish.yml by .github/workflows/deploy.yml,
# so every deploy reinstalls it on the gh-pages branch of atreib/eurotrip-app.
# It publishes the branch to Pages via actions/deploy-pages. The legacy branch
# builder is NOT used: it hung indefinitely on this site (2026-08-06).
name: Publish to Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site (only what should be served)
        run: |
          mkdir -p _site
          cp index.html _site/
          # The encrypted attachments the app fetches on demand. They are the reason
          # index.html is ~250 KB instead of 28 MB — leave them out and the page still
          # loads but every attachment button 404s. cp fails loudly if a/ is missing.
          cp -r a _site/a
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub's Pages backend intermittently parks a deployment on
      # "deployment_in_progress" until deploy-pages times out (seen repeatedly on
      # 2026-08-06: the identical artifact failed at 10min, then published in 31s
      # on retry). Retry rather than fail the publish.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Fail if no attempt published
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' && steps.deployment_retry2.outcome == 'failure'
        run: exit 1
