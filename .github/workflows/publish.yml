# Shipped into dist/.github/workflows/publish.yml by .github/workflows/deploy.yml,
# so every deploy reinstalls it on the gh-pages branch of atreib/eurotrip-app.
# It publishes the branch to Pages via actions/deploy-pages. The legacy branch
# builder is NOT used: it hung indefinitely on this site (2026-08-06).
name: Publish to Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site (only what should be served)
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
