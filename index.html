<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eurotrip 2026</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ee">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10131a">
<style>
:root{
  color-scheme: light dark;
  --bg:#f4f2ee; --card:#ffffff; --text:#22252a; --muted:#6e747d;
  --line:#e4e1da; --accent:#0b6bcb; --accent-ink:#ffffff;
  --ok:#177245; --ok-bg:#e5f2ea; --chip:#eceae4;
  --half-bg:#def0e2; --half-ink:#1c5c34;
  --warn-bg:#fdeceb; --warn-ink:#a02216; --warn-line:#f3cbc7;
  --full-bg:#dcebfb; --full-ink:#1d4f91;
  --shadow:0 1px 2px rgba(30,25,10,.06), 0 4px 16px rgba(30,25,10,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10131a; --card:#181c25; --text:#e7e9ee; --muted:#98a0ad;
    --line:#272d3a; --accent:#5aa2ff; --accent-ink:#0b1220;
    --ok:#4cc38a; --ok-bg:#17301f; --chip:#232937;
    --half-bg:#17301f; --half-ink:#7ed9a3;
    --warn-bg:#331a18; --warn-ink:#ff9c90; --warn-line:#5b2a26;
    --full-bg:#152a42; --full-ink:#8ab8f0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:var(--accent)}
a,button,summary{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.skip{position:absolute; left:-9999px; top:0; background:var(--card); padding:8px 12px; z-index:99; border-radius:0 0 8px 0}
.skip:focus{left:0}

.topbar{
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; gap:2px;
  padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.back{
  display:inline-flex; align-items:center; justify-content:center;
  width:44px; height:44px; margin:-6px 0; border-radius:12px;
  color:var(--text); text-decoration:none;
}
.back:hover{background:var(--chip)}
.back[hidden]{display:none}
.topbar-title{
  font-weight:650; font-size:17px; padding-left:6px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;
}

main{max-width:640px; margin:0 auto; padding:16px 16px 56px}
h1,h2{scroll-margin-top:64px}

.hero{padding:8px 2px 4px}
.hero h1{margin:0; font-size:28px; letter-spacing:-.02em; text-wrap:balance}
.hero .sub{margin:4px 0 10px; color:var(--muted)}
.hero .totals{margin:0; display:flex; gap:8px; flex-wrap:wrap}

.chip{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--chip); border:1px solid transparent; border-radius:999px;
  padding:3px 11px; font-size:13px; color:var(--text);
}
.chip.ok{background:var(--ok-bg); color:var(--ok)}
.chip.resv{background:#fbf0d9; color:#8a6414; flex:none}
.money{font-variant-numeric:tabular-nums}

.stops{list-style:none; margin:16px 0 0; padding:0; display:flex; flex-direction:column; gap:10px}
.stops li.sub{margin-left:26px}
.stop{
  display:flex; gap:12px; align-items:center;
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:13px 14px; box-shadow:var(--shadow);
  text-decoration:none; color:inherit;
}
.stop:hover{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.stop .flag{font-size:26px; line-height:1}
.stop .meta{min-width:0; flex:1}
.stop .name{font-weight:650}
.stop .when{color:var(--muted); font-size:14px}
.here{
  flex:none; background:var(--ok); color:#fff; border-radius:999px;
  padding:3px 10px; font-size:12px; font-weight:650; letter-spacing:.02em;
}
.chev{color:var(--muted); flex:none}

.tabs{display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none; display:inline-flex; align-items:center; min-height:38px;
  padding:6px 15px; border-radius:999px; border:1px solid var(--line);
  background:var(--card); color:var(--text); text-decoration:none; font-size:14px;
}
.tab.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.tab .n{margin-left:6px; opacity:.65; font-variant-numeric:tabular-nums}

.card{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow)}
.pad{padding:16px; display:flex; flex-direction:column; gap:14px}
.pad + .pad, .card + .card{margin-top:12px}
.badges{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
button.chip{cursor:pointer; font:inherit; font-size:13px; min-height:28px}
button.chip:hover{border-color:var(--accent); color:var(--accent)}
.place{margin:0; font-size:20px; letter-spacing:-.01em}
.addr .text{white-space:pre-line; overflow-wrap:break-word}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.btn{
  display:inline-flex; align-items:center; gap:7px; min-height:42px;
  padding:8px 15px; border-radius:11px; border:1px solid var(--line);
  background:transparent; color:var(--text); font:inherit; font-size:14px;
  cursor:pointer; text-decoration:none;
}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn[hidden]{display:none}

.off-head{display:flex; gap:12px; align-items:center}
.off-head .flag{font-size:26px; line-height:1}
.off-head .meta{min-width:0; flex:1}
.off-head .name{font-weight:650}
.off-head .when{color:var(--muted); font-size:14px}
.off-bar{height:6px; border-radius:999px; background:var(--chip); overflow:hidden}
.off-bar .fill{height:100%; width:0; background:var(--accent); border-radius:999px; transition:width .25s ease}
.times{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.time-tile{border:1px solid var(--line); border-radius:12px; padding:10px 12px; min-width:0}
.time-tile .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted)}
.time-tile .day{font-weight:600; font-size:14px}
.time-tile .hm{font-size:21px; font-weight:650; font-variant-numeric:tabular-nums}

.cost-line{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.cost-line .lbl{color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.06em}
.cost-line strong{font-size:18px}
.muted{color:var(--muted)}

.kv{margin:0; display:flex; flex-direction:column}
.kv-row{display:flex; gap:12px; padding:10px 0 9px; border-top:1px solid var(--line)}
.kv-row:last-child{padding-bottom:0}
.kv dt{flex:0 0 30%; color:var(--muted); font-size:13px; padding-top:2px}
.kv dd{margin:0; flex:1; min-width:0; display:flex; gap:6px; align-items:flex-start; justify-content:space-between}
.val{white-space:pre-line; overflow-wrap:break-word; min-width:0}
.vlist{margin:0; padding-left:18px}
.copy{
  flex:none; display:inline-flex; align-items:center; justify-content:center;
  width:40px; height:40px; margin:-8px -8px -8px 0;
  border:none; background:transparent; color:var(--muted);
  cursor:pointer; border-radius:10px;
}
.copy:hover{color:var(--accent); background:var(--chip)}

details.day{margin-top:12px}
details.day:first-of-type{margin-top:0}
details.day > summary, details.period > summary{list-style:none; cursor:pointer}
details.day > summary::-webkit-details-marker,
details.period > summary::-webkit-details-marker{display:none}
.day-h{
  font-size:16px; text-transform:capitalize;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:11px 14px; border-radius:12px;
  background:var(--text); color:var(--bg); min-height:44px;
}
.day-h:hover{opacity:.92}
.day-h h2{margin:0; font-size:16px; font-weight:650}
.day-h .day-copy{color:inherit; opacity:.7; flex:none}
.day-h .day-copy:hover{opacity:1}
details.day.off-half > .day-h{background:var(--half-bg); color:var(--half-ink)}
details.day.off-full > .day-h{background:var(--full-bg); color:var(--full-ink)}
details.day.today > .day-h{background:var(--accent); color:var(--accent-ink)}
details.day.today.off-half > .day-h{background:var(--half-bg); color:var(--half-ink); box-shadow:inset 0 0 0 2px var(--accent)}
details.day.today.off-full > .day-h{background:var(--full-bg); color:var(--full-ink); box-shadow:inset 0 0 0 2px var(--accent)}
.today-tag, .off-tag{
  font-size:12px; font-weight:650; text-transform:none;
  border-radius:999px; padding:2px 10px;
  background:color-mix(in srgb, currentColor 16%, transparent);
}
.day-body{
  margin:12px 0 6px 10px; padding-left:16px;
  border-left:2px solid var(--line);
}
.count{margin-left:auto; font-size:12px; color:inherit; opacity:.78; font-variant-numeric:tabular-nums; text-transform:none}
.chev-i{
  flex:none; width:8px; height:8px; margin-right:3px;
  border-right:2px solid currentColor; border-bottom:2px solid currentColor;
  transform:rotate(-45deg); transition:transform .15s ease; opacity:.55;
}
details[open] > summary .chev-i{transform:rotate(45deg)}
details.period{margin-top:14px}
.period-h{
  display:flex; align-items:center; gap:8px; min-height:32px;
  font-size:12px; font-weight:600; text-transform:uppercase;
  letter-spacing:.07em; color:var(--muted); padding:4px 2px;
}
.period-h .pcount{font-weight:400}
.period-h .chev-i{margin-left:2px}
details.period > details.item{margin-top:8px}
.day-body > details.item{margin-top:10px}
details.item + details.item{margin-top:8px}
.item-work .ititle{font-weight:750}
details.item summary{
  display:flex; align-items:center; gap:10px; padding:13px 14px;
  cursor:pointer; list-style:none; min-height:44px;
}
details.item summary::-webkit-details-marker{display:none}
.ititle{font-weight:450; flex:1; min-width:0; overflow-wrap:break-word}
.chip.time{flex:none; font-variant-numeric:tabular-nums}
.item-body{padding:2px 14px 14px; display:flex; flex-direction:column; gap:12px; border-top:1px solid var(--line); padding-top:12px; margin:0 0}

.rowline{display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-top:1px solid var(--line); align-items:baseline}
.rowline:first-child{border-top:none; padding-top:0}
.rowline .what{min-width:0}
.rowline .sub{color:var(--muted); font-size:13px}
.rowline .amt{font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:600}

.section-h{font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:20px 2px 8px}
.section-h:first-child{margin-top:0}

.buy-tip{margin:0 0 14px}
.buy-tip .buy-lbl{
  display:block; font-size:12px; font-weight:600; text-transform:uppercase;
  letter-spacing:.07em; color:var(--muted); margin-bottom:6px;
}
.buy-tip p{margin:0; font-size:14px; line-height:1.5}
.city-docs{margin:0 0 14px}
.city-docs .buy-lbl{margin-bottom:8px}
.city-docs .actions{margin:0}

/* ---- phrasebook dialog ---- */
.city-actions{margin:0 0 14px}
.phrasebook{
  width:min(560px, calc(100vw - 24px)); max-height:min(80vh, 720px);
  padding:0; border:1px solid var(--line); border-radius:18px;
  background:var(--card); color:var(--text); box-shadow:var(--shadow);
  overscroll-behavior:contain;
}
.phrasebook::backdrop{background:rgba(20,18,12,.55); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px)}
.ph-head{
  position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:12px;
  padding:16px 16px 12px; background:var(--card); border-bottom:1px solid var(--line);
}
.ph-head h2{margin:0; font-size:17px; letter-spacing:-.01em; flex:1; min-width:0}
.ph-close{
  flex:none; width:40px; height:40px; margin:-4px -4px -4px 0; border-radius:11px;
  border:1px solid var(--line); background:transparent; color:var(--text);
  font:inherit; font-size:16px; cursor:pointer; line-height:1;
}
.ph-close:hover{border-color:var(--accent); color:var(--accent)}
.ph-scroll{overflow-y:auto; max-height:calc(min(80vh,720px) - 66px); padding:14px 16px 18px}
.ph-note{margin:0 0 16px; font-size:14px; line-height:1.55; color:var(--muted)}
.ph-group{margin:0 0 18px}
.ph-group:last-child{margin-bottom:0}
.ph-group h3{
  margin:0 0 8px; font-size:12px; text-transform:uppercase;
  letter-spacing:.07em; color:var(--muted); font-weight:600;
}
.ph-list{list-style:none; margin:0; padding:0}
.ph-row{display:flex; align-items:baseline; gap:10px; padding:10px 0; border-top:1px solid var(--line)}
.ph-row:first-child{border-top:none}
.ph-text{min-width:0; flex:1}
.ph-local{display:block; font-weight:650; font-size:15px; overflow-wrap:break-word}
.ph-pt{display:block; font-size:13px; color:var(--muted); margin-top:2px}
.ph-pron{display:block; font-size:13px; color:var(--muted); font-style:italic; margin-top:1px}

/* ---- food checklist dialog (same shell as the phrasebook) ---- */
.city-actions{display:flex; gap:8px; flex-wrap:wrap}
.fd-row{display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-top:1px solid var(--line)}
.fd-row:first-child{border-top:none}
.fd-row input[type=checkbox]{flex:none; width:22px; height:22px; margin:1px 0 0; accent-color:var(--accent)}
.fd-text{min-width:0; flex:1; cursor:pointer}
.fd-name{display:block; font-weight:650; font-size:15px; overflow-wrap:break-word}
.fd-what{display:block; font-size:13px; color:var(--muted); line-height:1.5; margin-top:3px}
.fd-tip{display:block; font-size:13px; color:var(--muted); margin-top:3px; font-style:italic}
.fd-row.done .fd-name{text-decoration:line-through; color:var(--muted)}
/* ---- "where to work" rows (same dialog shell, read-only) ---- */
.wk-row{display:block; padding:12px 0; border-top:1px solid var(--line)}
.wk-row:first-child{border-top:none}
.wk-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.wk-order{
  display:block; margin-top:8px; padding:8px 10px; border-radius:8px;
  background:var(--ok-bg); color:var(--text); font-size:13px; line-height:1.5;
}
.wk-order b{color:var(--ok)}
.wk-order ul{margin:4px 0 0; padding-left:18px}
.wk-order li{margin-top:2px}
.wk-avoid{
  display:block; margin-top:6px; padding:8px 10px; border-radius:8px;
  background:var(--warn-bg); color:var(--warn-ink);
  border:1px solid var(--warn-line); font-size:13px; line-height:1.5;
}
/* ---- "Ideas" tab: a flat scan-list of things to do ---- */
.id-lead{font-size:14px; line-height:1.55; color:var(--muted); margin:0 0 14px; padding:0 2px}
.id-tally{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 18px}
.id-group{margin-bottom:18px}
.id-ghead{display:flex; align-items:baseline; gap:8px; margin:0 2px 8px}
.id-gtitle{font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted)}
.id-gn{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.id-row{display:flex; gap:10px; padding:11px 0; border-top:1px solid var(--line)}
.id-row:first-child{border-top:none}
.id-mark{flex:none; width:18px; text-align:center; font-size:13px; line-height:1.5}
.id-body{min-width:0; flex:1}
.id-name{display:block; font-weight:600; line-height:1.4; overflow-wrap:break-word}
.id-row.is-cut .id-name, .id-row.is-idea .id-name{font-weight:500}
.id-desc{display:block; font-size:13px; color:var(--muted); line-height:1.5; margin-top:2px}
.id-tag{
  display:inline-block; margin-left:6px; padding:1px 6px; border-radius:999px;
  font-size:11px; font-weight:600; letter-spacing:.02em; vertical-align:1px;
  background:var(--chip); color:var(--muted);
}
.id-row.is-planned .id-tag{background:var(--ok-bg); color:var(--ok)}
.wk-addr{display:flex; align-items:center; gap:6px; margin-top:6px; min-width:0}
.wk-addr a{
  display:inline-flex; align-items:center; gap:5px; min-width:0;
  font-size:13px; color:var(--accent); text-decoration:none; overflow-wrap:break-word;
}
.wk-addr a:hover{text-decoration:underline}
.wk-addr svg{flex:none}
/* ---- itinerary overview (one line per day) ---- */
.overview{margin:0 0 14px}
.ov-list{list-style:none; margin:8px 0 0; padding:0}
.ov-row{border-top:1px solid var(--line)}
.ov-row:first-child{border-top:none}
.ov-btn{
  display:flex; align-items:flex-start; gap:12px; width:100%;
  padding:10px 2px; background:none; border:0; font:inherit; color:inherit;
  text-align:left; cursor:pointer; border-radius:8px; min-height:44px;
  touch-action:manipulation;
}
.ov-btn:hover{background:var(--chip)}
.ov-btn:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.ov-date{display:flex; flex-direction:column; align-items:center; flex:none; width:46px; line-height:1.25}
.ov-date b{font-size:14px; font-variant-numeric:tabular-nums}
.ov-date span{font-size:11px; color:var(--muted); text-transform:capitalize}
.ov-text{flex:1; min-width:0; font-size:14px; line-height:1.45; overflow-wrap:break-word}
.ov-tag{
  display:inline-block; margin-left:6px; padding:1px 7px; border-radius:99px;
  font-size:11px; font-weight:650; vertical-align:1px;
}
.ov-row.today .ov-date b{color:var(--accent)}
.ov-row.off-half .ov-date b{color:var(--half-ink)}
.ov-row.off-full .ov-date b{color:var(--full-ink)}
.ov-row.off-half{background:var(--half-bg)}
.ov-row.off-full{background:var(--full-bg)}

/* ---- reservations dialog ---- */
.resv-where{font-size:13px; margin-bottom:10px}
.resv-where a{color:var(--accent); text-decoration:none}
.resv-where a:hover{text-decoration:underline}
.bk{margin-bottom:8px}
.shortcuts{margin:0 0 4px}
.shortcuts .stop{margin-bottom:8px}
.bk-why{font-size:13px; color:var(--muted); margin-bottom:8px}
.bk-date{font-size:13px; margin-bottom:8px}
.bk-urgent{box-shadow:inset 0 0 0 2px var(--accent)}
.section-h + .ph-note{margin:-6px 0 12px}
.fd-progress{margin:0 0 14px}

.empty{
  padding:36px 16px; text-align:center; color:var(--muted);
  background:var(--card); border:1px dashed var(--line); border-radius:16px;
}

/* ---- packing checklist ---- */
.pk-progress{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 14px}
.pk-bag-h{display:flex; align-items:center; gap:10px; margin-bottom:2px}
.pk-bag-h h2{margin:0; font-size:18px; letter-spacing:-.01em; flex:1; min-width:0}
.pk-bag-h .chip{flex:none}
ul.pk-list{list-style:none; margin:0; padding:0}
.pk-list .pk-list{margin:0 0 4px 11px; padding-left:14px; border-left:2px solid var(--line)}
.pk-row{
  display:flex; align-items:center; gap:12px;
  min-height:44px; padding:5px 4px; cursor:pointer; border-radius:10px;
}
.pk-row:hover{background:var(--chip)}
.pk-row input{width:22px; height:22px; accent-color:var(--accent); flex:none; margin:0; cursor:pointer}
.pk-row .pk-name{min-width:0; overflow-wrap:break-word}
.pk-row.done .pk-name{color:var(--muted); text-decoration:line-through}
li.pk-group{margin-top:8px}
.pk-section-h{
  font-size:12px; font-weight:600; text-transform:uppercase;
  letter-spacing:.07em; color:var(--muted); padding:8px 4px 4px;
}
.pk-row .pk-price{
  flex:none; margin-left:auto; font-size:13px; color:var(--muted);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}

#gate{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:40; padding:24px}
#gate[hidden]{display:none}
.gate-card{
  width:min(360px, 100%); display:flex; flex-direction:column; gap:12px;
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); padding:24px;
}
.gate-card h1{margin:0 0 4px; font-size:22px}
.gate-card label{font-size:13px; color:var(--muted)}
.gate-card input{
  font:inherit; font-size:16px; padding:10px 12px; border-radius:10px;
  border:1px solid var(--line); background:var(--bg); color:var(--text); min-height:44px;
}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); justify-content:center; font-weight:600}

  return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0));
}
const fmtDay     = d => new Intl.DateTimeFormat(undefined, {weekday:"short", day:"numeric", month:"short"}).format(d);
const fmtDayLong = d => new Intl.DateTimeFormat(undefined, {weekday:"long", day:"numeric", month:"long"}).format(d);
const fmtDM      = d => `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;
const fmtWD      = d => new Intl.DateTimeFormat(undefined, {weekday:"short"}).format(d);
const fmtTime    = d => new Intl.DateTimeFormat(undefined, {hour:"2-digit", minute:"2-digit"}).format(d);
function fmtMoney(amount, currency){
  try { return new Intl.NumberFormat("pt-BR", {style:"currency", currency}).format(amount); }
  catch { return `${currency} ${amount}`; }
}
function dateRange(a, b){
  const da = parseDate(a), db = parseDate(b);
  if(!da || !db) return "";
  return `${fmtDay(da)} → ${fmtDay(db)}`;
}
function nightsOf(city){
  if(city.stay && city.stay.nights) return city.stay.nights;
  const a = parseDate(city.arrive), b = parseDate(city.depart);
  return a && b ? Math.round((b - a) / 864e5) : null;
}
function isCurrent(city){
  const a = parseDate(city.arrive), b = parseDate(city.depart);
  if(!a || !b) return false;
  const t = new Date();
  return t >= a && t < new Date(b.getFullYear(), b.getMonth(), b.getDate() + 1);
}

/* Any object shaped like {amount, currency} counts as money — wherever it lives. */
function collectCosts(node, out = []){
  if(Array.isArray(node)){ node.forEach(n => collectCosts(n, out)); }
  else if(node && typeof node === "object"){
    if(node.mirror === true) return out; /* mirrored legs: shown in both cities, counted once */
    if(typeof node.amount === "number" && node.currency){ out.push(node); }
    else Object.values(node).forEach(v => collectCosts(v, out));
  }
  return out;
}
function sumByCurrency(costs){
  const m = new Map();
  for(const c of costs) m.set(c.currency, (m.get(c.currency) || 0) + c.amount);
  return [...m.entries()].map(([currency, sum]) => ({currency, sum}));
}
function toBRL(c){
  if(c.currency === "BRL") return c.amount;
  const r = RATES[c.currency];
  return r ? c.amount * r : null;
}
function combinedBRL(costs){
  let total = 0;
  for(const c of costs){
    const v = toBRL(c);
    if(v == null) return null;
    total += v;
  }
  return total;
}
function instText(cost){
  const i = cost.installments;
  if(!i) return "";
  if(typeof i === "number") return `${i}× de ${fmtMoney(cost.amount / i, cost.currency)}`;
  if(typeof i === "object") return `${i.count}× de ${fmtMoney(i.amount ?? cost.amount / i.count, i.currency || cost.currency)}`;
  return String(i);
}

/* ---------- generic key/value renderer (the flexibility engine) ---------- */
function renderValue(v){
  if(v == null) return "";
  if(Array.isArray(v)) return `<ul class="vlist">${v.map(x => `<li>${renderValue(x)}</li>`).join("")}</ul>`;
  if(typeof v === "object"){
    if(typeof v.amount === "number" && v.currency){
      const inst = instText(v);
      return `<span class="val money">${esc(fmtMoney(v.amount, v.currency))}${inst ? ` <span class="muted">· ${esc(inst)}</span>` : ""}</span>`;
    }
    return `<dl class="kv">${Object.entries(v).map(([k, val]) => kvRow(k, val)).join("")}</dl>`;
  }
  const s = String(v);
  if(/^https?:\/\//.test(s)) return `<a class="val" href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a>`;
  return `<span class="val">${esc(s)}</span>`;
}
function kvRow(k, v){
  const copyable = typeof v === "string" || typeof v === "number";
  return `<div class="kv-row"><dt>${esc(k)}</dt><dd>${renderValue(v)}${copyable ? copyIconBtn(v, k) : ""}</dd></div>`;
}
function detailsBlock(obj, knownKeys){
  /* merges declared `details` with any unknown top-level keys, so new data needs no code */
  const extras = {};
  for(const [k, v] of Object.entries(obj)) if(!knownKeys.has(k)) extras[k] = v;
  const merged = {...(obj.details || {}), ...extras};
  if(!Object.keys(merged).length) return "";
  return `<dl class="kv">${Object.entries(merged).map(([k, v]) => kvRow(k, v)).join("")}</dl>`;
}

/* ---------- offline attachments ----------
   The deployed build fetches an attachment only when it is tapped, so a day with no signal
   would otherwise mean no tickets. This pulls every one of them down in a single run; the
   service worker keeps the app itself openable offline. eurotrip.html already carries
   everything inline, so the card is absent there — as it is where CacheStorage is missing,
   since without it nothing could actually be kept. */
const OFFLINE_CACHE = "eurotrip-offline-v1";
const onDemandFiles = () => Object.values(FILES).filter(f => f.u);
const fmtMB = b => (b / 1048576).toFixed(1) + "\u00a0MB";
async function offlineCache(){ try { return await caches.open(OFFLINE_CACHE); } catch { return null; } }

function renderOfflineCard(){
  const list = onDemandFiles();
  if(!list.length || !self.caches) return "";
  const total = list.reduce((n, f) => n + (f.n || 0), 0);
  return `
  <h2 class="section-h">Offline</h2>
  <div class="card pad" id="offline-card" data-total="${total}">
    <div class="off-head">
      <span class="flag" aria-hidden="true">📥</span>
      <span class="meta">
        <span class="name">Attachments on this device</span><br>
        <span class="when" id="offline-sub">${list.length} attachments · ${fmtMB(total)}</span>
      </span>
      <span class="here" id="offline-ok" hidden>✓ Saved</span>
    </div>
    <div class="off-bar" id="offline-bar" hidden><div class="fill"></div></div>
    <div class="actions">
      <button class="btn btn-primary" id="offline-save">Save all for offline</button>
      <button class="btn" id="offline-cancel" hidden>Cancel</button>
    </div>
  </div>`;
}
/* Which attachments are already on the device is only knowable asynchronously, so the card
   renders with the totals and fills in its real state right after. */
async function refreshOfflineCard(){
  const card = document.getElementById("offline-card");
  if(!card || offlineAbort) return;
  const list = onDemandFiles();
  const cache = await offlineCache();
  let saved = 0, savedBytes = 0;
  for(const f of list){
    if(cache && await cache.match(f.u)){ saved++; savedBytes += f.n || 0; }
  }
  if(!document.getElementById("offline-card")) return;
  const total = +card.dataset.total, left = total - savedBytes, all = saved === list.length;
  document.getElementById("offline-ok").hidden = !all;
  document.getElementById("offline-sub").textContent = all
    ? `All ${list.length} saved · ${fmtMB(total)} · opens with no signal`
    : `${saved} of ${list.length} saved · ${fmtMB(left)} still to download`;
  const save = document.getElementById("offline-save");
  save.hidden = all;
  save.textContent = `Save all for offline · ${fmtMB(left)}`;
}
let offlineAbort = null;
async function saveAllOffline(){
  /* Claim the slot synchronously: everything below awaits, and a second tap arriving in one
     of those gaps would otherwise start a parallel run that double-counts the progress. */
  if(offlineAbort) return;
  offlineAbort = new AbortController();
  const card = document.getElementById("offline-card");
  const cache = await offlineCache();
  if(!card || !cache){ offlineAbort = null; return; }
  const list = onDemandFiles();
  const total = +card.dataset.total;
  const sub = document.getElementById("offline-sub");
  const bar = document.getElementById("offline-bar");
  const fill = bar.firstElementChild;
  const save = document.getElementById("offline-save");
  const cancel = document.getElementById("offline-cancel");

  /* Whatever a previous run managed to save counts, so a cancelled run resumes rather than
     starting over — it is 15 MB on someone else's roaming data. */
  let done = 0, bytes = 0;
  const todo = [];
  for(const f of list){
    if(await cache.match(f.u)){ done++; bytes += f.n || 0; } else todo.push(f);
  }
  save.hidden = true; cancel.hidden = false; bar.hidden = false;
  const paint = () => {
    fill.style.width = (total ? Math.round(100 * bytes / total) : 0) + "%";
    sub.textContent = `Saving ${done} of ${list.length} · ${fmtMB(bytes)} of ${fmtMB(total)}`;
  };
  paint();
  try {
    for(const f of todo){
      /* Goes through the same path as opening one, so an attachment is only counted as saved
         once it has actually decrypted — "saved" that turns out to be unusable in a place
         with no signal would be worse than not offering this at all. */
      await assetPlaintext(f, offlineAbort.signal);
      done++; bytes += f.n || 0;
      paint();
    }
    toast("All attachments saved — the app now opens with no signal");
  } catch(err) {
    toast(err && err.name === "AbortError"
      ? `Stopped · ${done} of ${list.length} saved`
      : `Could not finish · ${done} of ${list.length} saved — check your connection`);
  } finally {
    offlineAbort = null;
    cancel.hidden = true;
    bar.hidden = true;
    fill.style.width = "0%";
    refreshOfflineCard();
  }
}
document.addEventListener("click", e => {
  if(e.target.closest("#offline-save")){ e.preventDefault(); saveAllOffline(); }
  else if(e.target.closest("#offline-cancel")){ e.preventDefault(); if(offlineAbort) offlineAbort.abort(); }
});

      <summary class="day-h">${CHEV}<h2>${d ? esc(fmtDayLong(d)) : esc(day.date || "")}</h2>
        ${today ? '<span class="today-tag">Today</span>' : ""}
        ${offTag ? `<span class="off-tag">${offTag}</span>` : ""}
        <span class="count">${count ? `${count} item${count > 1 ? "s" : ""}` : "free day"}</span>
        ${count ? `<button class="copy day-copy" data-copy-day="${esc(city.id)}:${di}" aria-label="Copy day plan to clipboard" title="Copy day plan">${ICON_COPY}</button>` : ""}
      </summary>
      <div class="day-body">${flat + sections || empty("Free day")}</div>
    </details>`;
  }).join("");
}

/* ---------- itinerary overview (high-level: one line per day) ----------
   Each day may carry `summary` (a short string). Without it we fall back to the first
   non-work item of each period, so a city with no summaries still gets a usable list. */
function daySummary(day){
  if(day.summary) return day.summary;
  const parts = PERIODS.map(([k]) => {
    const first = (day[k] || []).find(it => !it.work && it.title);
    return first ? first.title : "";
  }).filter(Boolean);
  return parts.join(" · ");
}
function overviewBlock(city){
  const days = city.itinerary || [];
  if(days.length < 3) return "";
  return `<div class="card pad overview">
    <span class="buy-lbl">🗺️ Overview · ${days.length} days</span>
    <ol class="ov-list">${days.map((day, di) => {
      const d = parseDate(day.date);
      const today = isToday(d);
      const offTag = day.off === "full" ? "Full day off" : day.off === "half" ? "Half-day off" : "";
      return `<li class="ov-row${today ? " today" : ""}${day.off ? " off-" + esc(day.off) : ""}">
        <button class="ov-btn" data-goto-day="${di}">
          <span class="ov-date"><b>${d ? esc(fmtDM(d)) : esc(day.date || "")}</b><span>${d ? esc(fmtWD(d)) : ""}</span></span>
          <span class="ov-text">${esc(daySummary(day)) || '<span class="muted">free day</span>'}
            ${today ? '<span class="ov-tag today-tag">Today</span>' : ""}
            ${offTag ? `<span class="ov-tag off-tag">${offTag}</span>` : ""}
          </span>
        </button>
      </li>`;
    }).join("")}</ol>
  </div>`;
}

/* ---------- bookings (trip-wide, first-class data) ----------
   `trip.bookings` is the single source of truth for everything that has to be reserved.
   It is NOT derived from the itinerary — deriving it double-counted (the "go book X" item
   plus the visit to X) and hid the things that have no itinerary yet, like a flight that
   was never bought. Order is urgency, and urgency means availability first, price second:
     tier "sellout"  — a slot/seat that runs out, or a window that opens on a date
     tier "price"    — never runs out, but costs more the later you buy
     tier "none"     — fixed price, always available: do NOT pre-book, pay on the spot
   Each booking may carry `attachments` (the PDF, once bought) exactly like a stay or leg. */
const LEVELS = [
  {n: 1, label: "🔴 Nível 1 — o quanto antes",
   note: "Deixar pra depois custa caro ou custa a vaga. Compre assim que abrir o app."},
  {n: 2, label: "🟠 Nível 2 — quando puder",
   note: "Importante, mas não muda de preço nem some nos próximos dias."},
  {n: 3, label: "⚪ Nível 3 — sem pressa",
   note: "Está na lista pra não ser esquecido. Nada acontece se ficar pra semana que vem."},
];
const REASONS = {
  sellout: {chip: "🎟️ esgota", why: "Lugar marcado e número limitado."},
  price:   {chip: "💶 encarece", why: "Nunca esgota — o que sobe é o preço."},
};
const BOOKING_KNOWN = new Set(["id","what","city","when","tier","level","status","opens","deadline","price","url","attachments","details","note"]);
function bookings(){ return DATA.trip.bookings || []; }
function bookingStats(){
  const all = bookings().filter(b => b.tier !== "none");
  return {total: all.length, todo: all.filter(b => b.status !== "booked").length};
}
function daysUntil(dateStr){
  const d = parseDate(dateStr);
  if(!d) return 9999;
  const t = new Date();
  return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate())
                   - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000);
}
/* A booking is "locked" while its sales window has not opened yet — the only kind of
   date this list states, because it is the only one that actually exists. */
function bkLocked(b){ return !!b.opens && daysUntil(b.opens) > 0; }
function bookingCard(b){
  const used = parseDate(b.when);
  const city = byId[b.city];
  const done = b.status === "booked";
  const reason = REASONS[b.tier];
  const opens = b.opens ? parseDate(b.opens) : null;
  const deadline = b.deadline ? parseDate(b.deadline) : null;
  return `<details class="card item bk${!done && b.level === 1 && !bkLocked(b) ? " bk-urgent" : ""}">
    <summary>
      ${used ? `<span class="chip time">${esc(fmtDM(used))}</span>` : ""}
      <span class="ititle">${esc(b.what || "")}</span>
      ${done ? '<span class="chip ok">✓ Reservado</span>'
        : b.tier === "none" ? '<span class="chip">na hora</span>'
        : reason ? `<span class="chip resv">${reason.chip}</span>` : ""}
    </summary>
    <div class="item-body">
      <div class="resv-where">
        ${city ? `${esc(city.flag || "")} <a href="#/${esc(city.id)}/itinerary">${esc(city.name || city.id)}</a>` : ""}
        ${used ? `<span class="muted"> · usa em ${esc(fmtDay(used))}</span>` : ""}
      </div>
      ${!done && reason ? `<div class="bk-why">${reason.chip} — ${esc(reason.why)}</div>` : ""}
      ${opens ? `<div class="bk-date">🗓️ A venda só abre em <strong>${esc(fmtDay(opens))}</strong>${daysUntil(b.opens) > 0 ? ` · faltam ${daysUntil(b.opens)} dias` : " · já abriu"}</div>` : ""}
      ${deadline ? `<div class="bk-date">⏳ Data limite: <strong>${esc(fmtDay(deadline))}</strong></div>` : ""}
      ${b.url ? `<div class="actions"><a class="btn" target="_blank" rel="noopener" href="${esc(b.url)}">🔗 Abrir o site da reserva</a>${copyIconBtn(b.url, "link")}</div>` : ""}
      ${b.price ? costLine(b.price) : ""}
      ${attachmentsBlock(b)}
      ${detailsBlock(b, BOOKING_KNOWN) || '<div class="muted">Sem detalhes extras</div>'}
    </div>
  </details>`;
}
function renderBookings(){
  const all = bookings();
  if(!all.length) return empty("Nenhuma reserva cadastrada");
  const open = all.filter(b => b.status !== "booked" && b.tier !== "none");
  const locked = open.filter(bkLocked);
  const live = open.filter(b => !bkLocked(b));
  const sect = (label, note, list) => list.length ? `<section>
    <h2 class="section-h">${label} · ${list.length}</h2>
    <p class="ph-note">${esc(note)}</p>
    ${list.map(bookingCard).join("")}
  </section>` : "";
  return `
  <p class="pk-progress">
    <span class="chip money${open.length ? "" : " ok"}">${open.length ? `${open.length} a reservar` : "🎉 tudo reservado"}</span>
    <span class="chip money">${all.filter(b => b.status === "booked").length} feitas</span>
  </p>
  <p class="ph-note">A ordem é a prioridade. Cada item diz POR QUE é urgente — 🎟️ porque esgota, 💶 porque encarece — e só mostra data quando ela existe de verdade (venda que abre num dia certo). Nível 1 primeiro; dentro do nível, de cima pra baixo.</p>
  ${LEVELS.map(l => sect(l.label, l.note, live.filter(b => (b.level || 2) === l.n))).join("")}
  ${sect("⏳ Ainda não dá pra comprar", "A venda abre numa data certa. Antes dela, não adianta abrir o site.", locked)}
  ${sect("✅ Não precisa reservar", "Tarifa fixa ou entrada sempre disponível — paga na hora, mesmo preço. Reservar aqui só adiciona taxa.", all.filter(b => b.tier === "none" && b.status !== "booked"))}
  ${sect("✓ Já reservado", "O PDF de cada uma fica aqui dentro, junto do link.", all.filter(b => b.status === "booked").sort((a, b) => String(a.when).localeCompare(String(b.when))))}`;
}
function renderBookingsCard(){
  const s = bookingStats();
  if(!s.total) return "";
  const soon = bookings().filter(b => b.status !== "booked" && b.tier !== "none" && b.level === 1 && !bkLocked(b)).length;
  return `
  <a class="stop" href="#/bookings">
    <span class="flag" aria-hidden="true">🎫</span>
    <span class="meta">
      <span class="name">Reservas</span><br>
      <span class="when money">${s.todo ? `${s.todo} a reservar${soon ? ` · ${soon} no nível 1` : ""}` : "tudo reservado"}</span>
    </span>
    ${s.todo ? `<span class="here">${s.todo}</span>` : '<span class="here">✓</span>'}
    <svg class="chev" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </a>`;
}

/* ---------- spending ---------- */
/* Per-section subtotal chips: one per currency, plus ≈BRL whenever anything is non-BRL. */
function subtotalChips(costs){
  const totals = sumByCurrency(costs);
  if(!totals.length) return "";
  const brl = combinedBRL(costs);
  const onlyBRL = totals.length === 1 && totals[0].currency === "BRL";
  return `<div class="badges" style="margin:-4px 0 10px">
    ${totals.map(t => `<span class="chip money">${esc(fmtMoney(t.sum, t.currency))}</span>`).join("")}
    ${brl != null && !onlyBRL ? `<span class="chip money">≈ ${esc(fmtMoney(brl, "BRL"))}</span>` : ""}
  </div>`;
}
function renderSpending(city){
  const prebooked = [];
  if(city.stay && city.stay.cost)
    prebooked.push({...city.stay.cost, label: [city.stay.type || "Stay", city.stay.name || city.stay.area].filter(Boolean).join(" — ")});
  for(const leg of city.transport || [])
    if(leg.cost && !leg.mirror) prebooked.push({...leg.cost, label: `${KIND_ICON[leg.kind] || "🎫"} ${leg.from || "?"} → ${leg.to || "?"}`});
  const rows = city.spending || [];
  const all = [...prebooked, ...collectCosts(rows)];
  const totals = sumByCurrency(all);
  const approx = totals.length > 1 ? combinedBRL(all) : null;
  if(!prebooked.length && !rows.length) return empty("No spending tracked yet");
  return `
  ${totals.length ? `<div class="badges" style="margin-bottom:14px">${totals.map(t => `<span class="chip money">${esc(fmtMoney(t.sum, t.currency))} total</span>`).join("")}${approx != null ? `<span class="chip money">≈ ${esc(fmtMoney(approx, "BRL"))} combined</span>` : ""}</div>` : ""}
  ${prebooked.length ? `<h2 class="section-h">Booked in advance (stay + transport)</h2>
  ${subtotalChips(prebooked)}
  <div class="card pad">${prebooked.map(c => `
    <div class="rowline">
      <span class="what">${esc(c.label || c.what || "Reservation")}${c.installments ? `<br><span class="sub">${esc(instText(c))}</span>` : ""}</span>
      <span class="amt money">${esc(fmtMoney(c.amount, c.currency))}</span>
    </div>`).join("")}
  </div>` : ""}
  ${rows.length ? `<h2 class="section-h">On the ground (day-to-day)</h2>
  ${subtotalChips(collectCosts(rows))}
  <div class="card pad">${rows.map(r => `
    <div class="rowline">
      <span class="what">${esc(r.what || r.label || "")}${r.date || r.category ? `<br><span class="sub">${[r.date && parseDate(r.date) ? fmtDay(parseDate(r.date)) : r.date, r.category].filter(Boolean).map(esc).join(" · ")}</span>` : ""}</span>
      <span class="amt money">${esc(fmtMoney(r.amount, r.currency))}${r.currency !== "BRL" && toBRL(r) != null ? `<br><span class="sub">≈ ${esc(fmtMoney(toBRL(r), "BRL"))}</span>` : ""}</span>
    </div>`).join("")}
  </div>` : ""}`;
}

/* ---------- packing checklist ----------
   Data: trip.packing.bags[] with nested items[]. `section: true` = visual group header
   (not checkable); any other item is checkable, even when it has children.
   Checkbox state lives in localStorage (keyed by item path), seeded from `done` in data.
   Toggling a parent NEVER touches its children — 100% is reached manually. */
const PK_KEY = "eurotrip:packing";
function pkStore(){
  try { return JSON.parse(localStorage.getItem(PK_KEY)) || {}; } catch { return {}; }
}
function pkChecked(id, it, ov){ return id in ov ? !!ov[id] : !!it.done; }
function pkStats(items, path, ov){
  let total = 0, done = 0;
  for(const it of items || []){
    const id = `${path}/${it.name}`;
    if(!it.section){ total++; if(pkChecked(id, it, ov)) done++; }
    if(it.items){ const s = pkStats(it.items, id, ov); total += s.total; done += s.done; }
  }
  return {total, done};
}
function pkList(items, path, ov, attr = "pk"){
  return `<ul class="pk-list">${(items || []).map(it => {
    const id = `${path}/${it.name}`;
    if(it.section) return `<li class="pk-group"><div class="pk-section-h">${esc(it.name)}</div>${pkList(it.items, id, ov, attr)}</li>`;
    const checked = pkChecked(id, it, ov);
    return `<li>
      <label class="pk-row${checked ? " done" : ""}">
        <input type="checkbox" data-${attr}="${esc(id)}"${checked ? " checked" : ""}>
        <span class="pk-name">${esc(it.name)}</span>
        ${it.price && typeof it.price.amount === "number" ? `<span class="pk-price money">${esc(fmtMoney(it.price.amount, it.price.currency))}</span>` : ""}
      </label>
      ${it.items ? pkList(it.items, id, ov, attr) : ""}
    </li>`;
  }).join("")}</ul>`;
}
function pkProgressText(s){
  const pct = s.total ? Math.round(100 * s.done / s.total) : 0;
  return `${s.done}/${s.total} · ${pct}%`;
}
function renderPacking(){
  const pk = DATA.trip.packing;
  if(!pk || !(pk.bags || []).length) return empty("No packing list yet");
  const ov = pkStore();
  const all = pkStats(pk.bags.flatMap(b => b.items || []), "", ov);
  return `
  <p class="pk-progress">
    <span class="chip money${all.done === all.total ? " ok" : ""}" data-pk-total>${all.done === all.total ? "🎉 " : ""}${esc(pkProgressText(all))}</span>
  </p>
  ${pk.bags.map((bag, i) => {
    const s = pkStats(bag.items, "", ov);
    return `<section class="card pad">
      <div class="pk-bag-h">
        <h2>${esc(bag.icon || "🧳")} ${esc(bag.name)}</h2>
        <span class="chip money${s.done === s.total ? " ok" : ""}" data-pk-bag="${i}">${esc(pkProgressText(s))}</span>
      </div>
      ${pkList(bag.items, "", ov)}
    </section>`;
  }).join("")}`;
}
function pkRefreshCounts(){
  const pk = DATA.trip.packing;
  if(!pk) return;
  const ov = pkStore();
  const set = (el, s) => {
    if(!el) return;
    el.textContent = pkProgressText(s);
    el.classList.toggle("ok", s.done === s.total);
  };
  const all = pkStats(pk.bags.flatMap(b => b.items || []), "", ov);
  const totalEl = document.querySelector("[data-pk-total]");
  set(totalEl, all);
  if(totalEl && all.done === all.total) totalEl.textContent = "🎉 " + totalEl.textContent;
  pk.bags.forEach((bag, i) => set(document.querySelector(`[data-pk-bag="${i}"]`), pkStats(bag.items, "", ov)));
}
document.addEventListener("change", e => {
  const cb = e.target.closest("input[data-pk]");
  if(!cb) return;
  const ov = pkStore();
  ov[cb.getAttribute("data-pk")] = cb.checked ? 1 : 0;
  try { localStorage.setItem(PK_KEY, JSON.stringify(ov)); } catch {}
  cb.closest(".pk-row").classList.toggle("done", cb.checked);
  pkRefreshCounts();
});

/* ---------- shopping list (per-Airbnb groceries) ----------
   Data: trip.shopping.items[] — same shape as packing (section/items nesting) plus an
   optional `price` {amount,currency} per item, dictated in chat as a running reference
   of what each thing costs. Checkbox state overlays in localStorage keyed by
   trip.shopping.run — bumping `run` in data starts a clean round at the next Airbnb
   while the prices in data stay. */
function shKey(){ return `eurotrip:shopping:${(DATA.trip.shopping && DATA.trip.shopping.run) || "1"}`; }
function shStore(){
  try { return JSON.parse(localStorage.getItem(shKey())) || {}; } catch { return {}; }
}
function shTotalsChips(items){
  const totals = sumByCurrency(collectCosts(items));
  if(!totals.length) return "";
  const brl = combinedBRL(collectCosts(items));
  const onlyBRL = totals.length === 1 && totals[0].currency === "BRL";
  return totals.map(t => `<span class="chip money">${esc(fmtMoney(t.sum, t.currency))} list</span>`).join("")
    + (brl != null && !onlyBRL ? `<span class="chip money">≈ ${esc(fmtMoney(brl, "BRL"))}</span>` : "");
}
function renderShopping(){
  const sh = DATA.trip.shopping;
  if(!sh || !(sh.items || []).length) return empty("No items yet — dictate them in chat and they'll show up here");
  const ov = shStore();
  const s = pkStats(sh.items, "", ov);
  return `
  <p class="pk-progress">
    <span class="chip money${s.done === s.total ? " ok" : ""}" data-sh-total>${s.done === s.total ? "🎉 " : ""}${esc(pkProgressText(s))}</span>
    ${shTotalsChips(sh.items)}
  </p>
  <section class="card pad">${pkList(sh.items, "", ov, "sh")}</section>`;
}
document.addEventListener("change", e => {
  const cb = e.target.closest("input[data-sh]");
  if(!cb) return;
  const ov = shStore();
  ov[cb.getAttribute("data-sh")] = cb.checked ? 1 : 0;
  try { localStorage.setItem(shKey(), JSON.stringify(ov)); } catch {}
  cb.closest(".pk-row").classList.toggle("done", cb.checked);
  const el = document.querySelector("[data-sh-total]");
  if(el){
    const s = pkStats(DATA.trip.shopping.items, "", shStore());
    el.textContent = (s.done === s.total ? "🎉 " : "") + pkProgressText(s);
    el.classList.toggle("ok", s.done === s.total);
  }
});

/* ---------- "Ideas" tab ----------
   A flat, scannable list of everything doable at a stop: what is in the plan, what was
   left out, and what the region offers that we never wrote down. No prices, no times,
   no rationale — this screen exists to judge the BALANCE between doing and looking,
   so kinds are ordered hands-on first and sightseeing last. */
const IDEA_KINDS = [
  ["experience", "\u{1F91D}", "Experiences — do it, don't watch it"],
  ["outdoor",    "\u{1F30A}", "Outdoors, water & day trips"],
  ["food",       "\u{1F374}", "Food & drink as an activity"],
  ["walk",       "\u{1F6B6}", "Neighbourhoods & walks"],
  ["sight",      "\u{1F3DB}\uFE0F", "Sights & museums"],
];
const IDEA_STATUS = {
  planned: ["\u2713", "in the plan"],
  cut:     ["\u25CB", "left out"],
  idea:    ["\u2728", "idea"],
};

function ideaKind(it){
  return IDEA_KINDS.some(k => k[0] === it.kind) ? it.kind : "experience";
}
function renderIdeas(city){
  const all = city.ideas || [];
  if(!all.length) return empty("No idea list for this stop yet");
  const planned = all.filter(i => i.status === "planned").length;
  const byKind = IDEA_KINDS
    .map(([id, icon, label]) => ({icon, label, items: all.filter(i => ideaKind(i) === id)}))
    .filter(g => g.items.length);
  const hands = all.filter(i => ideaKind(i) !== "sight").length;
  return `
  <p class="id-lead">${all.length} things you could do here. ${planned} are already in the itinerary; the rest are on the table.</p>
  <div class="id-tally">
    <span class="chip">\u{1F91D} ${hands} hands-on</span>
    <span class="chip">\u{1F3DB}\uFE0F ${all.length - hands} to look at</span>
    <span class="chip time">\u2713 ${planned} in the plan</span>
  </div>
  ${byKind.map(g => `
  <section class="id-group">
    <div class="id-ghead">
      <span class="id-gtitle">${g.icon} ${esc(g.label)}</span>
      <span class="id-gn">${g.items.length}</span>
    </div>
    <div class="card pad">${g.items.map(it => {
      const st = IDEA_STATUS[it.status] || IDEA_STATUS.idea;
      return `
      <div class="id-row is-${esc(it.status || "idea")}">
        <span class="id-mark" aria-hidden="true">${st[0]}</span>
        <span class="id-body">
          <span class="id-name">${esc(it.name || "")}<span class="id-tag">${st[1]}</span></span>
          ${it.desc ? `<span class="id-desc">${esc(it.desc)}</span>` : ""}
        </span>
      </div>`;
    }).join("")}</div>
  </section>`).join("")}`;
}

/* ---------- routing & shell ---------- */
const TABS = [["stay","Stay"], ["transport","Transport"], ["itinerary","Itinerary"], ["ideas","Ideas"], ["spending","Spending"]];
const TAB_RENDER = {stay: renderStay, transport: renderTransport, itinerary: renderItinerary, ideas: renderIdeas, spending: renderSpending};

function tabCount(city, id){
  if(id === "transport") return (city.transport || []).length || "";
  if(id === "itinerary") return (city.itinerary || []).reduce((n, d) => n + dayItems(d).length, 0) || "";
  if(id === "ideas") return (city.ideas || []).length || "";
  if(id === "spending") return (city.spending || []).length || "";
  return "";
}
function renderCity(city, tab){
  return `
  <nav class="tabs" aria-label="Sections">
    ${TABS.map(([id, label]) => `<a href="#/${esc(city.id)}/${id}" class="tab${tab === id ? " active" : ""}"${tab === id ? ' aria-current="page"' : ""}>${label}${tabCount(city, id) ? `<span class="n">${tabCount(city, id)}</span>` : ""}</a>`).join("")}
  </nav>
  ${city.buy ? `<div class="card pad buy-tip"><span class="buy-lbl">🛍️ Worth buying here</span><p>${esc(city.buy)}</p></div>` : ""}
  ${(city.attachments || []).length ? `<div class="card pad city-docs"><span class="buy-lbl">📄 Documents for this stop</span>${attachmentsBlock(city)}</div>` : ""}
  ${cityActions(city)}
  ${phrasebookBlock(city)}
  ${foodBlock(city)}
  ${listDialogs(city)}
  <section>${TAB_RENDER[tab](city)}</section>`;
}


/* One row of city-level dialog triggers; each button only appears if its data exists. */
function cityActions(city){
  const btns = [
    (cityPhrases(city) || {}).groups && cityPhrases(city).groups.length
      ? `<button class="btn" data-phrasebook aria-haspopup="dialog">🗣️ Useful phrases · ${esc(cityPhrases(city).language || "local")}</button>` : "",
    city.food && (city.food.groups || []).length
      ? `<button class="btn" data-foodbook aria-haspopup="dialog">🍽️ ${esc(city.food.title || "Local food")}</button>` : "",
    listButtons(city),
  ].filter(Boolean);
  return btns.length ? `<div class="city-actions">${btns.join("")}</div>` : "";
}

/* Per-city "what to eat here" checklist. Ticks live in localStorage (fdKey), never in data. */
function fdKey(city){ return `eurotrip:food:${city.id}`; }
function fdStore(city){
  try { return JSON.parse(localStorage.getItem(fdKey(city))) || {}; } catch { return {}; }
}
function fdItems(food){ return (food.groups || []).flatMap(g => g.items || []); }
function fdStats(city){
  const ov = fdStore(city);
  const all = fdItems(city.food);
  return {total: all.length, done: all.filter(it => ov[it.name]).length};
}
function fdProgress(city){
  const s = fdStats(city);
  const pct = s.total ? Math.round(100 * s.done / s.total) : 0;
  return `${s.done}/${s.total} tried · ${pct}%`;
}
function foodBlock(city){
  const fd = city.food;
  if(!fd || !(fd.groups || []).length) return "";
  const ov = fdStore(city);
  const done = fdStats(city);
  return `
  <dialog class="phrasebook" id="foodbook" aria-label="${esc(fd.title || "Local food")}">
    <div class="ph-head">
      <h2>🍽️&nbsp; ${esc(fd.title || "Local food")}</h2>
      <button class="ph-close" data-close-foodbook aria-label="Close">✕</button>
    </div>
    <div class="ph-scroll">
      <p class="pk-progress fd-progress">
        <span class="chip money${done.done === done.total ? " ok" : ""}" data-fd-total>${done.done === done.total ? "🎉 " : ""}${esc(fdProgress(city))}</span>
      </p>
      ${fd.note ? `<p class="ph-note">${esc(fd.note)}</p>` : ""}
      ${(fd.groups || []).map(g => `
        <div class="ph-group">
          <h3>${esc(g.title || "")}</h3>
          <ul class="ph-list">${(g.items || []).map(it => {
            const on = !!ov[it.name];
            return `<li class="fd-row${on ? " done" : ""}">
              <input type="checkbox" data-fd="${esc(it.name)}"${on ? " checked" : ""} aria-label="${esc(it.name)}">
              <label class="fd-text">
                <span class="fd-name">${esc(it.name)}</span>
                ${it.what ? `<span class="fd-what">${esc(it.what)}</span>` : ""}
                ${it.tip ? `<span class="fd-tip">💡 ${esc(it.tip)}</span>` : ""}
              </label>
            </li>`;
          }).join("")}</ul>
        </div>`).join("")}
    </div>
  </dialog>`;
}

/* Per-city reference lists rendered as a dialog: `work` (cafés/libraries/coworking) and
   `gyms`. Same data shape for both: {title, note?, groups:[{title, items:[
   {name, what?, when?, price?, address?, mapsUrl?, tip?}]}]}. Read-only — the point is to
   decide fast where to go, so there are no checkboxes and nothing is scheduled. */
const LIST_DIALOGS = [
  {key: "work", id: "workbook", icon: "\u{1F4BB}", fallback: "Where to work"},
  {key: "gyms", id: "gymbook",  icon: "\u{1F3CB}\uFE0F", fallback: "Gyms"},
  {key: "eat",  id: "eatbook",  icon: "\u{1F35D}", fallback: "Where to eat"},
];
/* Every euro figure shown to the user carries its R$ next to it. Enforced in code, not in
   prose: the EUR 120 dinner of 2026-08-13 happened because a price chip stopped at the euro. */
function withBrl(txt){
  const rate = (DATA && DATA.trip && DATA.trip.rates && DATA.trip.rates.EUR) || 0;
  if(!rate || !txt || /R\$/.test(txt)) return txt;
  const m = /€\s?(\d+(?:[.,]\d+)?)(?:\s?(?:[–-]|a)\s?(\d+(?:[.,]\d+)?))?/.exec(txt);
  if(!m) return txt;
  const num = v => Math.round(parseFloat(String(v).replace(",", ".")) * rate);
  const lo = num(m[1]), hi = m[2] ? num(m[2]) : null;
  return `${txt} · ≈ R$ ${hi ? lo + "–" + hi : lo}`;
}

function listDialog(city, spec){
  const wk = city[spec.key];
  if(!wk || !(wk.groups || []).length) return "";
  return `
  <dialog class="phrasebook" id="${spec.id}" aria-label="${esc(wk.title || spec.fallback)}">
    <div class="ph-head">
      <h2>${spec.icon}&nbsp; ${esc(wk.title || spec.fallback)}</h2>
      <button class="ph-close" data-close-list="${spec.id}" aria-label="Close">\u2715</button>
    </div>
    <div class="ph-scroll">
      ${wk.note ? `<p class="ph-note">${esc(wk.note)}</p>` : ""}
      ${(wk.groups || []).map(g => `
        <div class="ph-group">
          <h3>${esc(g.title || "")}</h3>
          <ul class="ph-list">${(g.items || []).map(it => `
            <li class="wk-row">
              <span class="fd-name">${esc(it.name || "")}</span>
              ${it.what ? `<span class="fd-what">${esc(it.what)}</span>` : ""}
              ${(it.when || it.price || it.walk) ? `<span class="wk-chips">
                ${it.walk ? `<span class="chip">\u{1F6B6} ${esc(it.walk)}</span>` : ""}
                ${it.when ? `<span class="chip time">\u{1F552} ${esc(it.when)}</span>` : ""}
                ${it.price ? `<span class="chip money">${esc(withBrl(it.price))}</span>` : ""}
              </span>` : ""}
              ${it.address ? `<span class="wk-addr">
                <a href="${esc(mapsHref(it))}" target="_blank" rel="noopener">${ICON_PIN} ${esc(it.address)}</a>
                ${copyIconBtn(it.address, "address")}
              </span>` : ""}
              ${it.order ? `<span class="wk-order"><b>Peça:</b>${
                Array.isArray(it.order)
                  ? `<ul>${it.order.map(o => `<li>${esc(o)}</li>`).join("")}</ul>`
                  : ` ${esc(it.order)}`
              }</span>` : ""}
              ${it.avoid ? `<span class="wk-avoid">\u26D4 <b>Não peça:</b> ${esc(it.avoid)}</span>` : ""}
              ${it.tip ? `<span class="fd-tip">\u{1F4A1} ${esc(it.tip)}</span>` : ""}
            </li>`).join("")}</ul>
        </div>`).join("")}
    </div>
  </dialog>`;
}
function listDialogs(city){ return LIST_DIALOGS.map(spec => listDialog(city, spec)).join(""); }
function listButtons(city){
  return LIST_DIALOGS.map(spec => {
    const wk = city[spec.key];
    if(!wk || !(wk.groups || []).length) return "";
    return `<button class="btn" data-open-list="${spec.id}" aria-haspopup="dialog">${spec.icon} ${esc(wk.title || spec.fallback)}</button>`;
  }).join("");
}

/* Per-city phrasebook: a button that opens a <dialog> of local-language phrases.
   Data shape: city.phrases = {language, note?, groups:[{title, items:[[pt, local, pron?]]}]}. */
/* A phrasebook may be shared: city.phrases = "italian" resolves via trip.phrasebooks.
   One language is written once and every stop in that country points at it. */
function cityPhrases(city){
  const ph = city && city.phrases;
  if(typeof ph === "string"){
    return (DATA && DATA.trip && DATA.trip.phrasebooks && DATA.trip.phrasebooks[ph]) || null;
  }
  return ph || null;
}
function phrasebookBlock(city){
  const ph = cityPhrases(city);
  if(!ph || !(ph.groups || []).length) return "";
  return `

  <dialog class="phrasebook" id="phrasebook" aria-label="Useful phrases in ${esc(ph.language || "the local language")}">
    <div class="ph-head">
      <h2>🗣️&nbsp; ${esc(ph.language || "Phrases")}</h2>
      <button class="ph-close" data-close-phrasebook aria-label="Close">✕</button>
    </div>
    <div class="ph-scroll">
      ${ph.note ? `<p class="ph-note">${esc(ph.note)}</p>` : ""}
      ${(ph.groups || []).map(g => `
        <div class="ph-group">
          <h3>${esc(g.title || "")}</h3>
          <ul class="ph-list">${(g.items || []).map(it => {
            const [pt, local, pron] = Array.isArray(it) ? it : [it.pt, it.local, it.pron];
            return `<li class="ph-row">
              <span class="ph-text">
                <span class="ph-local">${esc(local || "")}</span>
                <span class="ph-pt">${esc(pt || "")}</span>
                ${pron ? `<span class="ph-pron">${esc(pron)}</span>` : ""}
              </span>
              ${copyIconBtn(local || "", local || "phrase")}
            </li>`;
          }).join("")}</ul>
        </div>`).join("")}
    </div>
  </dialog>`;
}

function route(){
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const tab = TAB_RENDER[parts[1]] ? parts[1] : "stay";
  return {cityId: parts[0], tab};
}
function render(){
  if(!DATA) return;
  const {cityId, tab} = route();
  const city = byId[cityId];
  const main = document.getElementById("main");
  const back = document.getElementById("backlink");
  const title = document.getElementById("topbar-title");
  if(cityId === "packing"){
    const pkTitle = (DATA.trip.packing && DATA.trip.packing.title) || "Packing";
    main.innerHTML = renderPacking();
    back.hidden = false;
    title.textContent = `🧳 ${pkTitle}`;
    document.title = `${pkTitle} · ${DATA.trip.title}`;
  } else if(cityId === "bookings"){
    main.innerHTML = renderBookings();
    back.hidden = false;
    title.textContent = "🎫 Reservas";
    document.title = `Reservas · ${DATA.trip.title}`;
  } else if(cityId === "shopping"){
    const shTitle = (DATA.trip.shopping && DATA.trip.shopping.title) || "Shopping";
    main.innerHTML = renderShopping();
    back.hidden = false;
    title.textContent = `🛒 ${shTitle}`;
    document.title = `${shTitle} · ${DATA.trip.title}`;
  } else if(!city){
    main.innerHTML = renderHome();
    back.hidden = true;
    title.textContent = DATA.trip.title;
    document.title = DATA.trip.title;
  } else {
    main.innerHTML = renderCity(city, tab);
    back.hidden = false;
    title.textContent = `${city.flag || ""} ${city.name}`.trim();
    document.title = `${city.name} · ${DATA.trip.title}`;
  }
  window.scrollTo(0, 0);
  refreshOfflineCard();
}
window.addEventListener("hashchange", render);

/* ---------- boot: plain data or passphrase-gated decryption ---------- */
function init(data){
  DATA = data;
  cities = DATA.cities;
  byId = Object.fromEntries(cities.map(c => [c.id, c]));
  RATES = DATA.trip.rates || {};
  FILES = DATA.files || {};
  document.getElementById("gate").hidden = true;
  render();
}
/* Uint8Array.from(str, c => c.charCodeAt(0)) runs a JS callback once per character, which cost
   ~700 ms on the payload this used to carry. The native decoder does it in single-digit ms. */
const b64bytes = s => {
  if(Uint8Array.fromBase64) return Uint8Array.fromBase64(s);
  const bin = atob(s), u = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
};
/* Held after a successful unlock so on-demand attachments decrypt with the same derived key. */
let KEY = null;
async function decryptPayload(e, pass){
  const te = new TextEncoder();
  const keyMat = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name: "PBKDF2", salt: b64bytes(e.salt), iterations: 310000, hash: "SHA-256"},
    keyMat, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64bytes(e.iv)}, key, b64bytes(e.data));
  KEY = key;
  return JSON.parse(new TextDecoder().decode(pt));
}
async function boot(){
  if(!(RAW && RAW.__encrypted)) return init(RAW);
  const stored = localStorage.getItem("eurotrip:pass");
  if(stored){
    try { return init(await decryptPayload(RAW.__encrypted, stored)); }
    catch { localStorage.removeItem("eurotrip:pass"); }
  }
  const gate = document.getElementById("gate");
  gate.hidden = false;
  document.getElementById("gate-pass").focus();
}
document.getElementById("gate-form").addEventListener("submit", async e => {
  e.preventDefault();
  const pass = document.getElementById("gate-pass").value.trim();
  const err = document.getElementById("gate-err");
  try {
    const data = await decryptPayload(RAW.__encrypted, pass);
    localStorage.setItem("eurotrip:pass", pass);
    err.hidden = true;
    init(data);
  } catch {
    err.hidden = false;
  }
});
boot();

/* Serves the shell and the saved attachments when there is no network. https only — it cannot
   be registered from file://, where eurotrip.html is a single self-contained file anyway. */
if(navigator.serviceWorker && location.protocol.startsWith("http")){
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* ---------- copy to clipboard ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
async function copyText(text, msg){
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  toast(msg || "Copied");
}
document.addEventListener("click", e => {
  const btn = e.target.closest("[data-copy]");
  if(!btn) return;
  e.preventDefault();
  copyText(btn.getAttribute("data-copy"));
});

/* Phrasebook dialog: open, close button, and click-on-backdrop to dismiss. */
document.addEventListener("click", e => {
  if(e.target.closest("[data-phrasebook]")){
    e.preventDefault();
    const d = document.getElementById("phrasebook");
    if(d) d.showModal();
    return;
  }
  if(e.target.closest("[data-close-phrasebook]")){
    e.preventDefault();
    const d = document.getElementById("phrasebook");
    if(d) d.close();
    return;
  }
  if(e.target.closest("[data-foodbook]")){
    e.preventDefault();
    const d = document.getElementById("foodbook");
    if(d) d.showModal();
    return;
  }
  if(e.target.closest("[data-close-foodbook]")){
    e.preventDefault();
    const d = document.getElementById("foodbook");
    if(d) d.close();
    return;
  }
  const openList = e.target.closest("[data-open-list]");
  if(openList){
    e.preventDefault();
    const d = document.getElementById(openList.getAttribute("data-open-list"));
    if(d) d.showModal();
    return;
  }
  const closeList = e.target.closest("[data-close-list]");
  if(closeList){
    e.preventDefault();
    const d = document.getElementById(closeList.getAttribute("data-close-list"));
    if(d) d.close();
    return;
  }
  const goto = e.target.closest("[data-goto-day]");
  if(goto){
    e.preventDefault();
    const day = document.querySelectorAll("details.day")[+goto.getAttribute("data-goto-day")];
    if(day){
      day.open = true;
      day.scrollIntoView({behavior: "smooth", block: "start"});
    }
    return;
  }
  const dlg = e.target.closest("dialog.phrasebook");
  if(dlg && e.target === dlg) dlg.close();   /* backdrop click */
  if(dlg && e.target.closest("a[href^='#/']")) dlg.close();   /* navigating away from a dialog */
});

/* Food checklist ticks persist per city in localStorage. */
document.addEventListener("change", e => {
  const cb = e.target.closest("input[data-fd]");
  if(!cb) return;
  const city = byId[route().cityId];
  if(!city) return;
  const ov = fdStore(city);
  if(cb.checked) ov[cb.getAttribute("data-fd")] = 1; else delete ov[cb.getAttribute("data-fd")];
  try { localStorage.setItem(fdKey(city), JSON.stringify(ov)); } catch {}
  cb.closest(".fd-row").classList.toggle("done", cb.checked);
  const el = document.querySelector("[data-fd-total]");
  if(el){
    const s = fdStats(city);
    el.textContent = (s.done === s.total ? "🎉 " : "") + fdProgress(city);
    el.classList.toggle("ok", s.done === s.total);
  }
});

/* Copy a whole day's plan as "- 9h: …" bullets (the user's WhatsApp format). */
function hShort(t){
  return String(t).split("–").map(p => {
    const m = p.trim().match(/^(\d{1,2}):(\d{2})$/);
    if(!m) return p.trim();
    return +m[1] + "h" + (m[2] === "00" ? "" : m[2]);
  }).join("–");
}
function dayPlanText(city, day){
  const d = parseDate(day.date);
  const head = `${d ? fmtDayLong(d) : (day.date || "")} — ${city.name}`;
  const lines = dayItems(day).map(it =>
    `- ${it.time ? hShort(it.time) + ": " : ""}${it.work ? "💼 " : ""}${it.title || ""}`);
  return [head, ...lines].join("\n");
}
document.addEventListener("click", e => {
  const btn = e.target.closest("[data-copy-day]");
  if(!btn) return;
  e.preventDefault();
  const [cid, i] = btn.getAttribute("data-copy-day").split(":");
  const city = byId[cid];
  const day = city && (city.itinerary || [])[+i];
  if(day) copyText(dayPlanText(city, day), "Day plan copied");
});

/* ---------- open attachments ----------
   eurotrip.html carries them inline as base64 (it has to stay a single offline file). The
   deployed build ships each one as its own encrypted asset, fetched only when tapped, so the
   page itself stays small enough for the browser to cache — see PERFORMANCE.md. */
const blobUrls = {};
const VIEWER_CSS = `html,body{margin:0;height:100%;background:#3a3d42;font:14px system-ui;color:#eee}
      .bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#24262b;color:#eee}
      .bar a{margin-left:auto;color:#8ab8f0;text-decoration:none;padding:6px 12px;border:1px solid #555;border-radius:8px}
      .msg{padding:24px 16px;opacity:.8}
      embed{width:100%;height:calc(100% - 48px)}`;
const viewerDoc = (name, body) =>
  `<!doctype html><title>${esc(name)}</title><style>${VIEWER_CSS}</style>${body}`;

/* An asset name is a hash of its plaintext, so a copy already on the device is never out of
   date and needs no revalidating. The one thing that rewrites an asset's bytes under an
   unchanged URL is a passphrase rotation, which surfaces here as a decrypt failure — so each
   source is tried in turn (kept for offline, HTTP cache, network) and a copy that will not
   decrypt is dropped rather than left to break the attachment forever. */
async function assetPlaintext(f, signal){
  const cache = await offlineCache();
  const iv = b64bytes(f.iv);
  const sources = [
    () => cache && cache.match(f.u),
    () => fetch(f.u, {cache: "force-cache", signal}),
    () => fetch(f.u, {cache: "reload", signal}),
  ];
  let last;
  for(let i = 0; i < sources.length; i++){
    if(signal && signal.aborted) throw new DOMException("Aborted", "AbortError");
    let res;
    try { res = await sources[i](); } catch(err){ last = err; if(err && err.name === "AbortError") throw err; continue; }
    if(!res || !res.ok) continue;
    const buf = await res.arrayBuffer();
    try {
      const bytes = new Uint8Array(await crypto.subtle.decrypt({name: "AES-GCM", iv}, KEY, buf));
      if(i > 0 && cache) await cache.put(f.u, new Response(buf));
      return bytes;
    } catch(err) {
      last = err;
      if(i === 0 && cache) await cache.delete(f.u);
    }
  }
  throw last || new Error("attachment unavailable");
}
async function fileBlobUrl(path, f){
  if(blobUrls[path]) return blobUrls[path];
  const bytes = f.data ? b64bytes(f.data) : await assetPlaintext(f);
  return blobUrls[path] = URL.createObjectURL(new Blob([bytes], {type: f.type}));
}
document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-open-file]");
  if(!btn) return;
  e.preventDefault();
  const path = btn.getAttribute("data-open-file");
  const f = FILES[path];
  if(!f){ toast("File not embedded — rebuild the app"); return; }
  const name = path.split("/").pop();
  /* The tab must be opened inside the click task or the popup blocker kills it, so it opens
     now with a placeholder and gets the real content once the bytes are ready. */
  const w = window.open("", "_blank");
  if(w){
    w.document.write(viewerDoc(name,
      `<div class="bar"><span>${esc(name)}</span></div><p class="msg">Loading ${esc(name)} …</p>`));
    w.document.close();
  } else if(!blobUrls[path] && !f.data){
    toast("Loading " + name + " …");
  }
  let url;
  try {
    url = await fileBlobUrl(path, f);
  } catch {
    if(w) w.close();
    toast("Could not open " + name + " — check your connection");
    return;
  }
  if(w){
    w.document.open();
    w.document.write(viewerDoc(name,
      `<div class="bar"><span>${esc(name)}</span><a href="${url}" download="${esc(name)}">Download</a></div>
      <embed src="${url}" type="${esc(f.type)}">`));
    w.document.close();
  } else {
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.click();
    toast("Downloaded " + name);
  }
});
</script>
